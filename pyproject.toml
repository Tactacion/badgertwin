[project]
name = "badgertwin"
version = "1.0.0"
description = "BadgerTwin: digital twin of UW-Madison's campus chilled-water network (hackathon demo)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "networkx>=3.2", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
data = ["wntr>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast tests of one module", "integration: API end to end"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["badgertwin"]
